#app [hidden],.in-box [hidden]{display:none!important}
.in-msg{min-height:1.5em;max-width:80ch;font-weight:650;margin:.5em 0}
.in-msg p{margin:.2em 0}
.in-lines{margin:.3em 0 .3em 1.2em;padding:0;max-width:80ch;overflow-wrap:anywhere}
.in-main{position:relative}
.in-tabs{display:flex;flex-wrap:wrap;margin:10px 0 6px}
.in-tabs .btn{margin:0 8px 8px 0;min-height:44px}
.in-box{position:relative;margin:8px 0;min-width:0}
.in-box h3{margin:1.1em 0 .4em}
.in-box h4{margin:1.2em 0 .4em}
.in-box h5,.in-maph{margin:1em 0 .4em;font-size:1rem}
.in-bar{display:flex;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.in-bar>*{margin:0 10px 8px 0;min-width:0;max-width:100%}
.in-bar .btn{min-height:44px}
.in-f{display:flex;flex-direction:column;font-size:.88rem;color:var(--mut);min-width:0;max-width:100%;margin:0 12px 10px 0}
.in-f>label{font-weight:650;margin-bottom:4px}
.in-inp{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;min-height:44px;padding:6px 10px;max-width:100%;min-width:0;box-sizing:border-box}
.in-inp:hover{border-color:var(--ac)}
.sel.in-inp{max-width:100%}
textarea.in-inp{display:block;width:100%;max-width:80ch;line-height:1.45;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
input.in-inp[type="text"]{width:100%;max-width:20rem}
input.in-num{width:6rem}
input[type="file"].in-inp{padding:8px 10px;max-width:100%}
.in-hint{color:var(--mut);font-size:.92rem;max-width:80ch;margin:.4em 0}
.in-count{max-width:80ch;margin:.8em 0;font-weight:650}
.in-meta{color:var(--mut);font-size:.9rem;margin:.2em 0;max-width:80ch;overflow-wrap:anywhere}
.in-note{font-size:.9rem;color:var(--mut);border-left:3px solid var(--line);padding-left:10px;margin:.5em 0;max-width:80ch}
.in-rules{font-weight:650;max-width:80ch;margin:.6em 0 .2em}
.in-big{font-size:1.25rem;font-weight:700;margin:.5em 0;max-width:80ch}
.in-box [tabindex="-1"]:focus{outline:3px solid var(--ac);outline-offset:2px}
.in-tblwrap:focus{outline:3px solid var(--ac);outline-offset:2px}
.in-start{min-height:44px;margin:.4em 0}

/* întrebarea */
.in-card{position:relative;max-width:50rem;margin:10px 0}
.in-qn{color:var(--mut);font-size:.9rem;margin:.2em 0;font-weight:650}
.in-topic{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:.8rem;color:var(--tx);background:var(--bg2);margin:.3em 0}
.in-qt{font-size:1.15rem;line-height:1.45;margin:.4em 0 .8em;white-space:pre-wrap;overflow-wrap:anywhere}
.in-qt sub,.in-qt sup,.in-at sub,.in-at sup,.in-expl sub,.in-expl sup{line-height:0}
.in-figbox{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0;max-width:32rem}
.in-fig{display:block;width:100%;height:auto;max-width:100%;color:#111}
.in-ans-list{margin:8px 0}
.in-ans{display:block;width:100%;max-width:46rem;text-align:left;white-space:normal;margin:8px 0;min-height:48px;padding:10px 14px;overflow-wrap:anywhere}
.in-k{font-weight:750;margin-right:.4em}
.in-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.8rem;font-weight:650;color:var(--tx);background:var(--bg2);margin-left:.4em}
.in-right{border-color:#2e9d4a;box-shadow:inset 5px 0 0 #2e9d4a}
.in-wrong{border-color:#d64545;box-shadow:inset 5px 0 0 #d64545}
.in-fb{margin:12px 0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:46rem}
.in-res{font-weight:700;margin:.3em 0}
.in-expl,.in-src{margin:.5em 0;max-width:80ch;overflow-wrap:anywhere}
.in-src{font-size:.88rem;color:var(--mut)}
.in-next{min-height:44px;margin-top:.5em}
.in-sum{margin-top:1em}
.in-again{min-height:44px}
.in-bad{color:#ffb4ab}
:root[data-theme="light"] .in-bad{color:#8c1d18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .in-bad{color:#8c1d18}}
.in-ok{color:#9be3a8;font-weight:650}
:root[data-theme="light"] .in-ok{color:#14591f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .in-ok{color:#14591f}}

/* examenul */
.in-xbar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;max-width:50rem;margin:8px 0}
.in-timer{font-size:1.2rem;font-weight:750;margin:6px 0}
.in-clock{font-variant-numeric:tabular-nums}
.in-opts{margin:8px 0}
.in-opt{display:flex;align-items:flex-start;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;min-height:44px;max-width:46rem;overflow-wrap:anywhere}
.in-opt:hover{border-color:var(--ac)}
.in-opt input{flex:none;width:20px;height:20px;margin:2px 10px 0 0}
.in-opt .in-at{flex:1 1 auto;min-width:0}
.in-xnav .btn{margin-bottom:8px}
.in-map{display:flex;flex-wrap:wrap;list-style:none;margin:6px 0;padding:0;max-width:50rem}
.in-map li{margin:0}
.in-mp{min-width:44px;min-height:44px;margin:0 6px 6px 0;padding:4px 6px;text-align:center}
.in-mp-done{border-color:var(--ac);font-weight:750;background:var(--bg2)}
.in-mp-flag{border-style:dashed;border-width:2px}
.in-mp-cur{outline:3px solid var(--ac);outline-offset:2px}
.in-sure{margin:12px 0;padding:10px 14px;border:2px solid var(--ac);border-radius:10px;max-width:46rem}
.in-sure .btn{min-height:44px}
.in-hist{margin:.4em 0 .4em 1.2em;padding:0;max-width:80ch}
.in-hist li{margin:.3em 0}
.in-rvl{margin:8px 0 8px 1.4em;padding:0;max-width:50rem}
.in-rv{margin:14px 0;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.in-rv p{margin:.3em 0}

/* tabele */
.in-tblwrap{overflow-x:auto;max-width:100%;margin:6px 0}
.in-tbl{border-collapse:collapse;min-width:18rem}
.in-tbl th,.in-tbl td{border:1px solid var(--line);padding:.35em .7em;text-align:right;font-weight:400}
.in-tbl thead th{background:var(--bg2);font-weight:650}
.in-tbl thead th:first-child,.in-tbl tbody th{text-align:left}
.in-tbl tbody th{font-weight:650}

/* pachete */
.in-pack{margin:14px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;background:var(--card);max-width:60rem;overflow-wrap:anywhere}
.in-pk-h{margin-top:.2em}
.in-imp{margin:22px 0 8px;max-width:60rem}
.in-rep{margin:10px 0;max-width:80ch;min-height:1.5em}
.in-rep .btn{min-height:44px;margin-top:.4em}
.in-steps{margin:.4em 0 .6em 1.4em;padding:0;max-width:80ch}
.in-steps li{margin:.5em 0}
.in-list-lim{max-width:80ch}
@media (max-width:860px){.in-inp{min-width:80px}}
</style>

estion {0}","w_exam":"Règles de l’examen","w_syl":"Élément du programme {0}","e_type":"Ce n’est pas un objet.","e_field":"« {0} » est absent ou non valide.","e_extra":"Un champ n’est pas connu du format.","e_format":"Ce n’est pas un paquet INDICATIV (vérifiez « format » et « version »).","e_questions":"« questions » doit avoir entre 1 et 3000 éléments.","e_answers":"Une question demande de 2 à 6 réponses.","e_answer_n":"La réponse {0} est vide, trop longue ou contient des caractères de contrôle.","e_answers_dup":"Deux réponses sont identiques.","e_correct":"« correct » doit être la position de la bonne réponse, en comptant à partir de 0.","e_id_dup":"L’identifiant est utilisé deux fois.","e_question_dup":"La même question avec les mêmes réponses apparaît deux fois.","e_syl_unknown":"« syllabus_ref » ne figure pas dans le « syllabus » du paquet.","e_figure":"La figure n’est pas acceptée ({0}).","e_figure_alt":"Une figure demande « figure_alt », et « figure_alt » demande une figure.","e_exam_many":"L’examen demande plus de questions que le paquet n’en a.","e_syllabus":"« syllabus » n’est pas valide.","e_quota":"Le navigateur n’a plus de place de stockage. Téléchargez votre progression et supprimez un paquet.","g_h":"Sauvegarde de la progression","g_help":"La progression et les résultats restent dans ce navigateur seulement. Téléchargez une copie pour la garder ou la porter sur un autre appareil.","g_dl":"Télécharger la progression","g_file_l":"Fichier de progression","g_load":"Charger la progression","g_loaded":"Progression chargée pour {0} questions.","g_err":"Ce n’est pas un fichier de progression de cette page.","gd_h":"Comment ça marche","gd_1":"Dans « S’entraîner », choisissez un paquet, une matière si vous voulez, et appuyez sur « Commencer ». Chaque réponse est vérifiée aussitôt et expliquée.","gd_2":"Les questions réussies reviennent après des intervalles de plus en plus longs (1, 3, 7, 14, 30 jours) ; celles que vous ratez reviennent aujourd’hui et encore une s, tempo, nota de aprovação) não estão incorporadas. Um pacote pode declará-las com a respetiva fonte; sem isso o simulador usa valores de treino, e passar aqui não prova nada sobre um exame real.","lim_4":"O esquema de repetição é simples, de cinco caixas com intervalos fixos, não um algoritmo afinado. O progresso fica neste navegador; limpar os dados do sítio apaga-o, a menos que tenha descarregado uma cópia.","lim_5":"A associação ao programa vale o que vale o pacote: a página verifica que «syllabus_ref» existe no pacote, mas não sabe dizer se a associação está certa. O programa CEPT HAREC não está incluído.","lim_6":"As traduções da interface foram escritas por máquina e não foram revistas por falantes nativos; as perguntas aparecem na língua do pacote."},"de":{"nav":"Trainer","title":"INDICATIV International · Prüfungstrainer","open":"Trainer öffnen","tabs_l":"Bereiche","tab_train":"Üben","tab_exam":"Prüfung","tab_packs":"Pakete","tab_guide":"Anleitung","f_pack":"Fragenpaket","f_topic":"Fach","f_all_topics":"Alle Fächer","f_mode":"Welche Fragen","m_due":"Fällige und neue","m_all":"Beliebige Fragen","m_weak":"Meine Schwächen","f_new":"Neue Fragen pro Tag","cl_zz":"ohne Land","th_topic":"Fach","t_h":"Üben","t_intro":"Richtige Antworten kommen nach 1, 3, 7, 14 und 30 Tagen wieder; falsche kommen heute wieder.","t_start":"Starten","t_stats":"{0} fällig · {1} neu · {2} in diesem Paket","t_none":"Mit diesen Einstellungen gibt es nichts zu üben. Wählen Sie «Beliebige Fragen» oder kommen Sie morgen wieder.","t_qn":"Frage {0} von {1}","t_ok":"Richtig.","t_bad":"Falsch. Richtige Antwort: {0}","t_expl":"Erklärung","t_source":"Quelle","t_next":"Nächste Frage","t_last":"Ergebnis ansehen","t_requeued":"Diese Frage kommt am Ende der Sitzung noch einmal.","t_done_h":"Sitzung beendet","t_done":"{0} Antworten, {1} richtig ({2} %).","t_again":"Noch einmal üben","t_keys":"Tasten: 1–{0} oder A–{1} wählen eine Antwort; Eingabe geht weiter.","t_group":"Antworten","x_h":"Prüfungssimul »).","e_questions":"«questions» muss zwischen 1 und 3000 Einträge haben.","e_answers":"Eine Frage braucht 2 bis 6 Antworten.","e_answer_n":"Antwort {0} ist leer, zu lang oder enthält Steuerzeichen.","e_answers_dup":"Zwei Antworten sind gleich.","e_correct":"«correct» muss die Position der richtigen Antwort sein, von 0 an gezählt.","e_id_dup":"Die ID wird zweimal verwendet.","e_question_dup":"Dieselbe Frage mit denselben Antworten kommt zweimal vor.","e_syl_unknown":"«syllabus_ref» steht nicht im «syllabus» des Pakets.","e_figure":"Die Abbildung wird nicht akzeptiert ({0}).","e_figure_alt":"Eine Abbildung braucht «figure_alt», und «figure_alt» braucht eine Abbildung.","e_exam_many":"Die Prüfung verlangt mehr Fragen, als das Paket hat.","e_syllabus":"«syllabus» ist ungültig.","e_quota":"Der Browser hat keinen Speicherplatz mehr. Laden Sie Ihren Fortschritt herunter und entfernen Sie ein Paket.","g_h":"Sicherung des Fortschritts","g_help":"Fortschritt und Ergebnisse bleiben nur in diesem Browser. Laden Sie eine Kopie herunter, um sie aufzubewahren oder auf ein anderes Gerät zu übertragen.","g_dl":"Fortschritt herunterladen","g_file_l":"Fortschrittsdatei","g_load":"Fortschritt laden","g_loaded":"Fortschritt für {0} Fragen geladen.","g_err":"Das ist keine Fortschrittsdatei dieser Seite.","gd_h":"So funktioniert es","gd_1":"Wählen Sie unter «Üben» ein Paket, wenn Sie möchten ein Fach, und drücken Sie «Starten». Jede Antwort wird sofort geprüft und erklärt.","gd_2":"Richtig beantwortete Fragen kommen nach immer längeren Abständen wieder (1, 3, 7, 14, 30 Tage); falsch beantwortete kommen heute und am Ende der Sitzung noch einmal.","gd_3":"Unter «Prüfung» wird das Paket wie ein Test verwendet: zufällige Fragen, Countdown und Bestehensgrenze. Das Ergebnis zeigt, was Sie falsch hatten. Mit demselben Startwert wiederholen Sie eine Prüfung.","gd_4":"Unter «Pakete» können Sie weitere Pakete importieren, herunterladen, den Fortschritt zurücksetzen und eine Sicherung des Fortschritts anlegen. Alles bleibt in diesem Browser.","gd_5":"Paketformat: eine JSON-Datei mit «format» gleich indicativ-pack und einer Liste von Fragen mit «answers» und «correct»; optional «syllabus», «exam»-Regeln, eine kleine eingeschränkte SVG als «figure» und Formeln wie f_{o} oder 10^{-6}. Siehe docs/pack-format.md im Repository.","h_limits":"Ehrliche Grenzen","lim_1":"Das eingebaute Paket ist eine kleine Sammlung von Übungsfragen, mit einem KI-Assistenten geschrieben und durch Rechnung oder Lehrbuchwissen geprüft. Es ist kein offizieller Fragenkatalog, und kein Prüfer hat es durchgesehen.","lim_2":"Es ist kein Länderpaket enthalten: Die öffentlichen Fragenkataloge von Ungarn, Italien, Deutschland und anderen ließen sich hier nicht herunterladen und prüfen, daher sind sie Aufgaben für Mitwirkende. Vergleichen Sie jedes Paket mit dem offiziellen Katalog, bevor Sie ihm vertrauen.","lim_3":"Die Regeln echter Prüfungen (Fragenzahl, Zeit, Bestehensgrenze) sind nicht eingebaut. Ein Paket kann sie mit ihrer Quelle angeben; ohne Angabe verwendet der Simulator Übungswerte, und Bestehen hier beweist nichts über eine echte Prüfung.","lim_4":"Das Wiederholschema ist ein einfaches Fünf-Fächer-Schema mit festen Abständen, kein abgestimmter Algorithmus. Der Fortschritt bleibt in diesem Browser; das Löschen der Website-Daten löscht ihn, falls Sie keine Sicherung heruntergeladen haben.","lim_5":"Die Zuordnung zum Lehrplan ist nur so gut wie das Paket: Die Seite prüft, dass «syllabus_ref» im Paket vorkommt, kann aber nicht sagen, ob die Zuordnung stimmt. Der CEPT-HAREC-Lehrplan ist nicht enthalten.","lim_6":"Die Übersetzungen der Oberfläche wurden maschinell geschrieben und von keinem Muttersprachler geprüft; Fragen erscheinen in der Sprache des Pakets."},"hu":{"nav":"Edző","title":"INDICATIV International · vizsgaedző","open":"Az edző megnyitása","tabs_l":"Részek","tab_train":"Gyakorlás","tab_exam":"Vizsga","tab_packs":"Csomagok","tab_guide":"Útmutató","f_pack":"Kérdéscsomag","f_topic aladás betöltve {0} kérdéshez.","g_err":"Ez nem ennek az oldalnak a haladásfájlja.","gd_h":"Hogyan működik","gd_1":"A «Gyakorlás» részben válassz csomagot, ha akarsz, tantárgyat is, és nyomd meg az «Indítás» gombot. Minden választ azonnal ellenőriz és megmagyaráz.","gd_2":"A helyesen megválaszolt kérdések egyre hosszabb idő után térnek vissza (1, 3, 7, 14, 30 nap); a hibásak még ma, és a gyakorlás végén még egyszer.","gd_3":"A «Vizsga» részben a csomag tesztként működik: véletlen kérdések, visszaszámlálás és sikeres határ. Az eredmény megmutatja, mit rontottál el. Ugyanazzal a kezdőértékkel megismételhetsz egy vizsgát.","gd_4":"A «Csomagok» részben további csomagokat importálhatsz, letöltheted őket, törölheted a haladást, és mentést készíthetsz róla. Minden ebben a böngészőben marad.","gd_5":"A csomag formátuma: JSON-fájl, amelyben a «format» értéke indicativ-pack, és kérdések listája «answers» és «correct» mezőkkel; választhatóan «syllabus», «exam» szabályok, kis, korlátozott SVG «figure»-ként, és képletek, például f_{o} vagy 10^{-6}. Lásd a docs/pack-format.md fájlt a tárolóban.","h_limits":"Őszinte korlátok","lim_1":"A beépített csomag néhány gyakorlókérdés, MI-asszisztenssel írva, számítással vagy tankönyvi tényekkel ellenőrizve. Nem hivatalos kérdésbank, és vizsgáztató nem nézte át.","lim_2":"Országcsomag nincs benne: Magyarország, Olaszország, Németország és mások nyilvános kérdésbankját itt nem lehetett letölteni és ellenőrizni, ezért ezek a közreműködők feladatai. Minden csomagot vess össze a hivatalos bankkal, mielőtt megbízol benne.","lim_3":"A valódi vizsgák szabályai (kérdésszám, idő, sikeres határ) nincsenek beépítve. A csomag megadhatja őket a forrásukkal együtt; enélkül a szimulátor gyakorló alapértékeket használ, és az itteni siker semmit sem bizonyít egy valódi vizsgáról.","lim_4":"Az ismétlési séma egyszerű, öt dobozos, rögzített időközökkel, nem finomhangolt algoritmus. A haladás ebben a böngészőben marad; a webhelyadatok törlése eltörli, hacsak nem töltöttél le másolatot.","lim_5":"A tananyaghoz rendelés annyit ér, mint a csomag: az oldal azt ellenőrzi, hogy a «syllabus_ref» szerepel a csomagban, de azt nem tudja, helyes-e a hozzárendelés. A CEPT HAREC tananyag nincs benne.","lim_6":"A felület fordításait gép írta, anyanyelvi beszélők nem nézték át; a kérdések a csomag nyelvén jelennek meg."}};
var DATA={"zz-practice":{"format":"indicativ-pack","version":1,"id":"zz-practice","title":"Practice questions (original, not an official bank)","country":"ZZ","licence_class":"practice","lang":"en","source":"Written for this project with an AI assistant; answers checked by calculation or against standard textbook facts. Not taken from any official question bank and not reviewed by an examiner.","license":"MIT","syllabus":[{"id":"1.1","title":"Circuits and Ohm’s law"},{"id":"1.2","title":"Reactance, resonance, decibels and transformers"},{"id":"2.1","title":"Radio waves and propagation"},{"id":"3.1","title":"Antennas and feed lines"},{"id":"4.1","title":"Transmitters and receivers"},{"id":"5.1","title":"Operating practice"},{"id":"6.1","title":"Safety and interference"}],"questions":[{"id":"ZZ-practice-0001","topic":"Electricity and circuits","question":"A 220 Ω resistor is connected across an 11 V battery. What current flows through it?","answers":["50 mA","5 mA","500 mA","2 A"],"correct":0,"explanation":"I = V / R = 11 V / 220 Ω = 0.05 A = 50 mA.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1"},{"id":"ZZ-practice-0002","topic":"Electricity and circuits","question":"A transmitter draws 2 A from a 13.8 V supply. How much power does it take from the supply?","answers":["6.9 W","15.8 W","55.2 W","27.6 W"],"correct":3,"explanation":"P = V × I = 13.8 V × 2 A = 27.6 W.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1"},{"id":"ZZ-practice-0003","topic":"Electricity and circuits","question":"Two resistors of 100 Ω and 150 Ω are connected in series. What is the total resistance?","answers":["60 Ω","125 Ω","250 Ω","15 000 Ω"],"correct":2,"explanation":"In series the resistances add: 100 Ω + 150 Ω = 250 Ω. (60 Ω would be the value for the same two resistors in parallel.)","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1"},{"id":"ZZ-practice-0004","topic":"Electricity and circuits","question":"Two 100 Ω resistors are connected in parallel. What is the total resistance?","answers":["200 Ω","50 Ω","100 Ω","25 Ω"],"correct":1,"explanation":"For two equal resistors in parallel the total is half of one of them: 100 Ω / 2 = 50 Ω.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1"},{"id":"ZZ-practice-0005","topic":"Electricity and circuits","question":"In the circuit shown, a 12 V supply is connected across R_{1} = 3 kΩ in series with R_{2} = 1 kΩ. What is the voltage across R_{2}?","answers":["9 V","3 V","4 V","12 V"],"correct":1,"explanation":"The same current flows through both resistors: I = 12 V / 4 kΩ = 3 mA. The voltage across R_{2} is 3 mA × 1 kΩ = 3 V.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1","figure":"<svg viewBox=\"0 0 200 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"20,38 20,20 50,20\"/><rect x=\"50\" y=\"12\" width=\"40\" height=\"16\"/><polyline points=\"90,20 110,20\"/><rect x=\"110\" y=\"12\" width=\"40\" height=\"16\"/><polyline points=\"150,20 180,20 180,70 20,70 20,46\"/><line x1=\"10\" y1=\"38\" x2=\"30\" y2=\"38\"/><line x1=\"15\" y1=\"46\" x2=\"25\" y2=\"46\"/><text x=\"32\" y=\"62\" font-size=\"10\" fill=\"currentColor\" stroke=\"none\">12 V<\/text><text x=\"70\" y=\"44\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" stroke=\"none\">R1 = 3 kΩ<\/text><text x=\"130\" y=\"44\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" stroke=\"none\">R2 = 1 kΩ<\/text><\/svg>","figure_alt":"Circuit diagram: a 12 V supply drives R1 (3 kΩ) in series with R2 (1 kΩ)."},{"id":"ZZ-practice-0006","topic":"Electricity and circuits","question":"What is the approximate reactance of a 1 µF capacitor at 159 Hz?","answers":["About 1 kΩ","About 100 Ω","About 10 kΩ","About 1 Ω"],"correct":0,"explanation":"X_{C} = 1 / (2πfC) = 1 / (2π × 159 Hz × 1 µF) ≈ 1 000 Ω.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.2"},{"id":"ZZ-practice-0007","topic":"Electricity and circuits","question":"What is the resonant frequency of a circuit with L = 10 µH and C = 100 pF?","answers":["15.9 MHz","503 kHz","50.3 MHz","5.03 MHz"],"correct":3,"explanation":"f_{0} = 1 / (2π√(LC)) = 1 / (2π × √(10×10^{-6} H × 100×10^{-12} F)) ≈ 5.03 MHz.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.2"},{"id":"ZZ-practice-0008","topic":"Electricity and circuits","question":"A signal’s power rises from 1 W to 4 W. By how many decibels does it rise?","answers":["3 dB","12 dB","6 dB","4 dB"],"correct":2,"explanation":"dB = 10 × log_{10}(P_{2} / P_{1}) = 10 × log_{10}(4) ≈ 6 dB.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.2"},{"id":"ZZ-practice-0009","topic":"Electricity and circuits","question":"A cable attenuates a signal by 10 dB. What fraction of the power entering the cable reaches the other end?","answers":["90 %","1 %","10 %","50 %"],"correct":2,"explanation":"−10 dB is a power ratio of 10^{-1} = 0.1, that is 10 %.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.2"},{"id":"ZZ-practice-0010","topic":"Electricity and circuits","question":"A transformer has 200 turns on its primary and 20 turns on its secondary. 230 V is applied to the primary. What is the secondary voltage of an ideal transformer?","answers":["2 300 V","23 V","230 V","11.5 V"],"correct":1,"explanation":"V_{s} = V_{p} × N_{s} / N_{p} = 230 V × 20 / 200 = 23 V.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.2"},{"id":"ZZ-practice-0011","topic":"Electricity and circuits","question":"A 50 Ω dummy load dissipates 100 W. What is the RMS voltage across it?","answers":["70.7 V","100 V","35.4 V","141 V"],"correct":0,"explanation":"P = V^{2} / R, so V = √(P × R) = √(100 W × 50 Ω) ≈ 70.7 V.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1"},{"id":"ZZ-practice-0012","topic":"Electricity and circuits","question":"Which component stores energy in a magnetic field?","answers":["A capacitor","A resistor","A diode","An inductor (coil)"],"correct":3,"explanation":"A coil stores energy in its magnetic field; a capacitor stores energy in an electric field.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.2"},{"id":"ZZ-practice-0013","topic":"Electricity and circuits","question":"A fixed resistor is connected to a battery. Which change would double the current through the resistor?","answers":["Doubling the resistance","Halving the voltage","Doubling both the voltage and the resistance","Doubling the voltage"],"correct":3,"explanation":"I = V / R: doubling V doubles I, doubling R halves it, and doubling both leaves I unchanged.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"1.1"},{"id":"ZZ-practice-0014","topic":"Propagation","question":"What is the wavelength of a 14.2 MHz signal, approximately?","answers":["2.1 m","210 m","21 m","42 m"],"correct":2,"explanation":"λ = c / f ≈ 300 / 14.2 MHz ≈ 21 m.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0015","topic":"Propagation","question":"About what wavelength does a 145 MHz signal have?","answers":["About 20 m","About 2 m","About 0.2 m","About 70 cm"],"correct":1,"explanation":"λ = c / f ≈ 300 / 145 MHz ≈ 2.07 m, which is why 144–146 MHz is called the 2 m band.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0016","topic":"Propagation","question":"Which ionospheric layer is the most important for long-distance (multi-hop) HF communication?","answers":["The F2 layer","The D layer","The troposphere","The E layer"],"correct":0,"explanation":"The F2 layer is the highest and most strongly ionised region; it refracts HF signals back to earth over the longest distances.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0017","topic":"Propagation","question":"What does the D layer mainly do to HF signals during the day?","answers":["It absorbs them, mostly on the lowest HF bands","It reflects them over long distances","It amplifies weak signals","It has no effect on HF signals"],"correct":0,"explanation":"The D layer exists only in daylight and absorbs low-frequency HF signals (for example 160 m and 80 m), which is why those bands work best at night.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0018","topic":"Propagation","question":"If the frequency of a radio wave is doubled, what happens to its wavelength?","answers":["It is doubled","It stays the same","It is quartered","It is halved"],"correct":3,"explanation":"λ = c / f: the wavelength is inversely proportional to the frequency.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0019","topic":"Propagation","question":"Which kind of propagation is normally used for local VHF and UHF contacts?","answers":["Reflection from the F2 layer","Ground wave along the surface over hundreds of kilometres","Line-of-sight (direct) waves","Reflection from the D layer"],"correct":2,"explanation":"VHF and UHF waves are not normally refracted back by the ionosphere; ordinary contacts rely on the direct path, slightly extended beyond the horizon.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0020","topic":"Propagation","question":"What is the “skip zone”?","answers":["The part of the ionosphere that absorbs signals","The area too far for the ground wave and too close for the sky wave to arrive","The area right below the antenna where the signal is strongest","The time of day when a band is closed"],"correct":1,"explanation":"The ground wave dies out after a limited distance, and the sky wave comes back to earth only beyond a minimum distance: in between lies the skip zone.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"2.1"},{"id":"ZZ-practice-0021","topic":"Antennas and feed lines","question":"Roughly how long is a half-wave wire dipole for 7.1 MHz, allowing for the usual end-effect shortening of about 5 %?","answers":["About 40 m","About 20 m","About 10 m","About 2 m"],"correct":1,"explanation":"The free-space half wavelength is 300 / 7.1 / 2 ≈ 21.1 m; shortening it by about 5 % gives ≈ 20 m (the common rule L ≈ 143 / f in MHz gives 20.1 m).","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0022","topic":"Antennas and feed lines","question":"What is the approximate feed-point impedance of a half-wave dipole in free space?","answers":["About 73 Ω","About 300 Ω","About 36 Ω","About 600 Ω"],"correct":0,"explanation":"A thin half-wave dipole in free space has a feed-point resistance of about 73 Ω; a folded dipole has about 300 Ω.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0023","topic":"Antennas and feed lines","question":"The forward power is 100 W and the reflected power is 4 W. What is the SWR?","answers":["2 : 1","1.2 : 1","4 : 1","1.5 : 1"],"correct":3,"explanation":"Reflection coefficient ρ = √(P_{r} / P_{f}) = √(4 / 100) = 0.2; SWR = (1 + ρ) / (1 − ρ) = 1.2 / 0.8 = 1.5.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0024","topic":"Antennas and feed lines","question":"An antenna has a gain of 3 dBd. What is that gain in dBi?","answers":["0.85 dBi","3 dBi","5.15 dBi","6 dBi"],"correct":2,"explanation":"The gain of a half-wave dipole over an isotropic radiator is 2.15 dB, so dBi = dBd + 2.15.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0025","topic":"Antennas and feed lines","question":"A transmitter delivers 10 W through a lossless feed line to an antenna with 3 dBd gain. What is the ERP (relative to a dipole)?","answers":["About 30 W","About 13 W","About 20 W","About 5 W"],"correct":2,"explanation":"+3 dB is a factor of about 2 in power: 10 W × 2 ≈ 20 W.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0026","topic":"Antennas and feed lines","question":"What does a balun do?","answers":["It increases the transmitter output power","It connects a balanced antenna to an unbalanced feed line, or the reverse","It filters out harmonics","It measures standing waves"],"correct":1,"explanation":"A balun (balanced–unbalanced transformer) matches a balanced antenna such as a dipole to an unbalanced coaxial cable.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0027","topic":"Antennas and feed lines","question":"Which characteristic impedance is the most common for coaxial cable in amateur stations?","answers":["50 Ω","75 Ω","300 Ω","600 Ω"],"correct":0,"explanation":"Most amateur transmitters and antennas are designed for 50 Ω; 75 Ω coax is mainly used for television and cable systems.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0028","topic":"Antennas and feed lines","question":"The wire antenna in the figure is fed in the middle, and each half is a quarter of a wavelength long. What is it called?","answers":["A quarter-wave ground plane","A Yagi antenna","A loop antenna","A half-wave dipole"],"correct":3,"explanation":"Two quarter-wave arms fed at the centre make a half-wave dipole.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1","figure":"<svg viewBox=\"0 0 200 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"10\" y1=\"30\" x2=\"97\" y2=\"30\"/><line x1=\"103\" y1=\"30\" x2=\"190\" y2=\"30\"/><line x1=\"97\" y1=\"30\" x2=\"97\" y2=\"80\"/><line x1=\"103\" y1=\"30\" x2=\"103\" y2=\"80\"/><text x=\"53\" y=\"20\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" stroke=\"none\">λ/4<\/text><text x=\"147\" y=\"20\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" stroke=\"none\">λ/4<\/text><text x=\"113\" y=\"60\" font-size=\"10\" fill=\"currentColor\" stroke=\"none\">feed line<\/text><\/svg>","figure_alt":"Two horizontal wires of equal length, each labelled a quarter wavelength, joined in the middle to a two-wire feed line going down."},{"id":"ZZ-practice-0029","topic":"Antennas and feed lines","question":"Which of these antennas has the greatest gain in one direction?","answers":["A vertical quarter-wave antenna","A half-wave dipole","An isotropic radiator","A multi-element Yagi antenna"],"correct":3,"explanation":"Adding a reflector and directors concentrates the radiation in one direction; the other choices have less gain, and an isotropic radiator is the 0 dBi reference.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"3.1"},{"id":"ZZ-practice-0030","topic":"Transmitters and receivers","question":"Which of these ways of sending speech needs the narrowest bandwidth?","answers":["Narrow-band FM","AM with two sidebands","Single sideband (SSB)","Wide-band FM"],"correct":2,"explanation":"An SSB voice signal occupies about 2.4 kHz, an AM signal about 6 kHz, narrow-band FM roughly 10–15 kHz and broadcast FM about 180 kHz.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0031","topic":"Transmitters and receivers","question":"What is the purpose of a low-pass filter at the output of an HF transmitter?","answers":["To increase the output power","To attenuate harmonics and other emissions above the operating frequency","To remove low-frequency audio","To improve the receiver’s sensitivity"],"correct":1,"explanation":"The filter lets the wanted frequency through and weakens harmonics, which could otherwise interfere with other services.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0032","topic":"Transmitters and receivers","question":"What is the selectivity of a receiver?","answers":["Its ability to separate the wanted signal from signals on nearby frequencies","Its ability to hear very weak signals","Its audio output power","Its speed of tuning across a band"],"correct":0,"explanation":"Selectivity is about rejecting neighbours; the ability to receive weak signals is called sensitivity.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0033","topic":"Transmitters and receivers","question":"What is the second harmonic of a 7.1 MHz transmission?","answers":["14.2 MHz","3.55 MHz","21.3 MHz","10.65 MHz"],"correct":0,"explanation":"The n-th harmonic is n × f: 2 × 7.1 MHz = 14.2 MHz (the third would be 21.3 MHz).","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0034","topic":"Transmitters and receivers","question":"In a superheterodyne receiver, which stage converts the incoming signal to the intermediate frequency?","answers":["The audio amplifier","The detector","The squelch circuit","The mixer"],"correct":3,"explanation":"The mixer combines the signal with the local oscillator; the difference frequency is the intermediate frequency (IF).","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0035","topic":"Transmitters and receivers","question":"What is the main job of automatic gain control (AGC) in a receiver?","answers":["To increase the transmitter power","To filter out noise pulses","To keep the output level nearly constant as the signal strength changes","To tune the receiver automatically"],"correct":2,"explanation":"AGC reduces the gain for strong signals and raises it for weak ones, so the loudness stays steady.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0036","topic":"Transmitters and receivers","question":"How is a CW (Morse code) signal produced?","answers":["By varying the carrier frequency with speech","By switching (keying) a carrier on and off","By suppressing the carrier and sending one sideband","By changing the polarisation of the carrier"],"correct":1,"explanation":"CW is on–off keying of an unmodulated carrier in the pattern of the Morse code.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"4.1"},{"id":"ZZ-practice-0037","topic":"Operating practice","question":"Which word stands for the letter K in the international spelling alphabet?","answers":["King","Kilo","Kansas","Kelvin"],"correct":1,"explanation":"ICAO/NATO spelling alphabet: … Juliet, Kilo, Lima …","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0038","topic":"Operating practice","question":"What does the Q-code QTH refer to?","answers":["The location of the station","The operating frequency","Interference from other stations","The transmitter power"],"correct":0,"explanation":"QTH = location. (QRG = frequency, QRM = interference from other stations, QRP = low power.)","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0039","topic":"Operating practice","question":"What does the Q-code QRM mean?","answers":["Natural noise such as static","Reduce your power","Change your frequency","Interference from other stations (man-made)"],"correct":3,"explanation":"QRM = man-made interference; QRN = natural noise; QRP = reduce power; QSY = change frequency.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0040","topic":"Operating practice","question":"What does the Q-code QSY mean?","answers":["Increase your power","Repeat your message","Change to another frequency","Stand by"],"correct":2,"explanation":"QSY = “change to another frequency”.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0041","topic":"Operating practice","question":"What does an RS report of 59 tell the other station?","answers":["Barely readable, weak signal","Readable with difficulty, moderate strength","Perfectly readable, very strong signal","Perfect tone, good quality"],"correct":2,"explanation":"R5 means perfectly readable and S9 a very strong signal (“five nine”).","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0042","topic":"Operating practice","question":"What is the meaning of the call “CQ”?","answers":["I am about to close down","A general call to any station that hears it","Please repeat your last message","I have an emergency"],"correct":1,"explanation":"CQ invites any station to reply; “CQ CQ CQ de” followed by the call sign is the usual form.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0043","topic":"Operating practice","question":"What does “73” mean in amateur radio?","answers":["Best regards","Love and kisses","Good luck","Good night"],"correct":0,"explanation":"73 = best regards (88 = love and kisses).","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0044","topic":"Operating practice","question":"In Morse operating, which prosign normally means “end of contact”?","answers":["K","BK","R","SK"],"correct":3,"explanation":"SK ends a contact; K = go ahead, BK = break, R = received.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"5.1"},{"id":"ZZ-practice-0045","topic":"Safety and interference","question":"What is the first thing to do before opening a mains-powered power supply for repair?","answers":["Switch it on to find the fault","Touch the case to check for voltage","Short-circuit the output","Disconnect it from the mains and let the capacitors discharge"],"correct":3,"explanation":"Mains voltage can be lethal, and large capacitors can stay charged after switching off.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"6.1"},{"id":"ZZ-practice-0046","topic":"Safety and interference","question":"What is the most serious danger of putting a wire antenna near overhead power lines?","answers":["Power lines absorb radio waves","The antenna would radiate less power","If it falls or touches a line, it can carry a lethal voltage","The mains would be interrupted every time you transmit"],"correct":2,"explanation":"A falling antenna or a contact with a line puts mains voltage on the wire and on the person touching it.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"6.1"},{"id":"ZZ-practice-0047","topic":"Safety and interference","question":"What is the safest course when a thunderstorm approaches and you have an outdoor antenna?","answers":["Transmit with extra power to discharge it","Disconnect the antenna from the equipment and stay away from it","Touch the coax shield to check for static","Stand next to the mast to protect it"],"correct":1,"explanation":"Lightning can travel down the feed line; disconnected cables and distance reduce the risk to people and equipment.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"6.1"},{"id":"ZZ-practice-0048","topic":"Safety and interference","question":"If you double your distance from a transmitting antenna (in the far field), what happens to the power density?","answers":["It falls to one quarter","It falls to one half","It stays the same","It falls to one eighth"],"correct":0,"explanation":"Power density follows the inverse-square law: 1 / 2^{2} = 1/4.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"6.1"},{"id":"ZZ-practice-0049","topic":"Safety and interference","question":"A transmitter’s harmonics disturb television reception. Which filter fitted at the transmitter output helps?","answers":["A low-pass filter","A high-pass filter","An audio-frequency filter","A mains filter only"],"correct":0,"explanation":"The harmonics lie above the operating frequency, so a low-pass filter weakens them.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"6.1"},{"id":"ZZ-practice-0050","topic":"Safety and interference","question":"Which measure keeps a metal equipment case from staying live if an internal mains wire touches it?","answers":["A bigger power switch","A plastic knob on the case","A longer mains cable","A protective earth connection together with a fuse or residual-current device"],"correct":3,"explanation":"The earth connection lets a fault current flow, and the fuse or RCD then cuts the supply.","source":"Original question written for this project (not from an official bank)","syllabus_ref":"6.1"}]}};

function dict() { return Object.create(null); }
function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function isInt(v, min, max) { return typeof v === 'number' && Math.floor(v) === v && v >= min && v <= max; }
// lungimea în puncte de cod (așa numără schema JSON și Python); -1 dacă are jumătăți de pereche surogat (JSON le admite, UTF-8 nu)
function cpLen(s) {
  let n = 0;
  for (let i = 0; i < s.length; i++, n++) {
    const c = s.charCodeAt(i);
    if (c >= 0xd800 && c <= 0xdbff) { const d = s.charCodeAt(i + 1); if (d >= 0xdc00 && d <= 0xdfff) i++; else return -1; }
    else if (c >= 0xdc00 && c <= 0xdfff) return -1;
  }
  return n;
}
function str(v, min, max) { if (typeof v !== 'string') return false; const n = cpLen(v); return n >= min && n <= max; }
function line(v, max) { return str(v, 1, max) && !CTRL_LINE.test(v); }
function block(v, max) { return str(v, 1, max) && !CTRL_TEXT.test(v); }
function isUrl(u) { return typeof u === 'string' && cpLen(u) >= 0 && URL_RE.test(u); }
// cheia de comparare a răspunsurilor și a întrebărilor: minuscule, fără semne diacritice combinate, spații comprimate
function fold(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[ \t\r\n\u00a0]+/g, ' ').replace(/^ | $/g, '');
}

function examRules(pack) {
  const e = pack && isObj(pack.exam) ? pack.exam : null;
  if (!e) return { questions: DEFAULT_EXAM.questions, minutes: DEFAULT_EXAM.minutes, pass_percent: DEFAULT_EXAM.pass_percent, wrong_penalty: 0, source: '', declared: false };
  return { questions: e.questions, minutes: e.minutes, pass_percent: e.pass_percent, wrong_penalty: e.wrong_penalty || 0, source: e.source, declared: true };
}

function buildExam(questions, rules, seed) {
  const n = Math.max(1, Math.min(rules.questions, questions.length));
  const pick = shuffled(questions.length, hash32('exam|' + seed)).slice(0, n);
  return { seed: seed >>> 0, ids: pick.map(function (i) { return questions[i].id; }), n: n, minutes: rules.minutes, pass: rules.pass_percent, penalty: rules.wrong_penalty || 0 };
}
// answers: {id: indicele ales în q.answers | -1}. -> {n, right, wrong, blank, points, percent, passed, topics: [{topic, n, right, wrong, blank}]}
function scoreExam(exam, answers, byId) {
  let right = 0, wrong = 0, blank = 0;
  const by = dict(), order = [];
  exam.ids.forEach(function (id) {
    const q = has(byId, id) ? byId[id] : null;
    if (!q) return;
    let t = by[q.topic];
    if (!t) { t = by[q.topic] = { topic: q.topic, n: 0, right: 0, wrong: 0, blank: 0 }; order.push(q.topic); }
    t.n++;
    const a = answers[id];
    if (!(isInt(a, 0, 5))) { blank++; t.blank++; }
    else if (a === q.correct) { right++; t.right++; }
    else { wrong++; t.wrong++; }
  });
  const n = right + wrong + blank;
  const points = Math.max(0, right - wrong * exam.penalty);
  const percent = n ? Math.round(points * 1000 / n) / 10 : 0;
  return { n: n, right: right, wrong: wrong, blank: blank, points: points, percent: percent, passed: n > 0 && points * 100 + 1e-9 >= exam.pass * n, topics: order.map(function (k) { return by[k]; }) };
}

}
